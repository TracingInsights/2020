name: top_speeds

on: 
  workflow_dispatch:

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  scrape-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: F1 TV authentication for FastF1
        uses: ./.github/actions/f1-auth
        with:
          token-json: ${{ secrets.F1AUTH_TOKEN }}
          username: ${{ secrets.F1_USERNAME }}
          password: ${{ secrets.F1_PASSWORD }}

      - name: Run top_speeds
        run: python top_speeds.py run-all
      - name: Commit changes
        run: |
          git config --local user.name github-actions
          git config --local user.email "action@github.com"
          git add .
          if [[ "$(git status --porcelain)" != "" ]]; then
              git commit -m "Update top_speeds" -a
              git push -u origin main
          fi
        env:
          REPO_KEY: ${{secrets.GITHUB_TOKEN}}
          username: github-actions   
      
